<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Segment Editor - Pits n' Giggles</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    @keyframes segbounce {
      0%   { transform: scale(1.04);  box-shadow: 0 0 0 2px #ef4444, 0 0 40px rgba(239,68,68,0.7); }
      45%  { transform: scale(1.018); box-shadow: 0 0 0 2px #ef4444, 0 0 20px rgba(239,68,68,0.4); }
      100% { transform: scale(1);     box-shadow: 0 0 0 0 transparent; }
    }
    @keyframes segflash {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }
    .seg-moving {
      animation: segbounce 0.75s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    }
    .seg-flash-overlay {
      background: linear-gradient(135deg, rgba(220,38,38,0.4) 0%, rgba(220,38,38,0.18) 100%);
      animation: segflash 0.75s ease-out forwards;
    }
    @keyframes headerSlideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .header-fields-enter {
      animation: headerSlideDown 0.18s ease-out forwards;
    }
  </style>
</head>
<body class="bg-black text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useReducer, useRef, useEffect } = React;

    // ─── Helpers ────────────────────────────────────────────────────────────────

    let _counter = 0;
    function makeId() { return `seg_${++_counter}_${Math.random().toString(36).slice(2,7)}`; }

    // Fields the editor understands. Anything else is carried through untouched, and flagged when
    // Pits n' Giggles would refuse it.
    const KNOWN_TOP_KEYS = new Set(["circuit_name", "circuit_number", "track_length", "segments", "sectors",
      "speed_trap_m", "drs_zones", "overtake_dist", "active_aero_zones"]);
    const KNOWN_SEG_KEYS = new Set(["type", "name", "start_m", "end_m", "corner_number", "corner_numbers", "brake_boards", "corners"]);
    // Top-level key order lib/track_segments_classifier writes, so a saved file matches its output.
    const LIB_TOP_ORDER = ["circuit_name", "circuit_number", "track_length", "speed_trap_m", "drs_zones",
      "overtake_dist", "active_aero_zones", "segments", "sectors"];
    const BOARD_DISTANCES = ["50", "100", "150", "200", "250", "300"];
    const BOARD_SIDES = ["left", "right", "both"];
    const AERO_MODES = ["full", "partial"];
    // Keys Pits n' Giggles accepts inside each nested object; any other key makes it refuse the file.
    const NESTED_KEYS = {
      drs_zone: ["id", "detection_m", "activation"],
      drs_activation: ["start_m", "end_m"],
      overtake_dist: ["detection_m", "activation_m"],
      aero_zone: ["mode", "start_m", "end_m"],
      brake_board: ["distance_m", "at_m", "side"],
      sub_corner: ["corner_number", "name", "start_m", "end_m", "brake_boards"],
    };

    function isPlainObject(v) {
      return typeof v === "object" && v !== null && !Array.isArray(v);
    }

    function str(v) {
      return v === null || v === undefined ? "" : String(v);
    }

    function replaceById(list, id, patch) {
      return list.map(x => x._id === id ? { ...x, ...patch } : x);
    }

    function removeById(list, id) {
      return list.filter(x => x._id !== id);
    }

    // Editor shape of the v2 points and zones: strings for inputs, an _id per row. Keeps _ids it is given.
    function editorMarkers({ speedTrap, drsZones, overtake, aeroZones }) {
      const list = v => Array.isArray(v) ? v.filter(isPlainObject) : [];
      const id = v => (typeof v === "string" && v) ? v : makeId();
      return {
        speedTrap: str(speedTrap),
        drsZones: list(drsZones).map(z => ({
          _id: id(z._id), id: str(z.id), detection_m: str(z.detection_m),
          activation: list(z.activation).map(a => ({ _id: id(a._id), start_m: str(a.start_m), end_m: str(a.end_m) })),
        })),
        overtake: isPlainObject(overtake)
          ? { detection_m: str(overtake.detection_m), activation_m: str(overtake.activation_m) }
          : null,
        aeroZones: list(aeroZones).map(z => ({ _id: id(z._id), mode: str(z.mode), start_m: str(z.start_m), end_m: str(z.end_m) })),
      };
    }

    function markersFromFile(data) {
      return editorMarkers({ speedTrap: data.speed_trap_m, drsZones: data.drs_zones,
        overtake: data.overtake_dist, aeroZones: data.active_aero_zones });
    }

    function editorBoards(boards) {
      if (!Array.isArray(boards)) return [];
      return boards.filter(isPlainObject).map(b => ({
        _id: (typeof b._id === "string" && b._id) ? b._id : makeId(),
        distance_m: str(b.distance_m), at_m: str(b.at_m), side: str(b.side),
      }));
    }

    function editorSubCorners(subs) {
      if (!Array.isArray(subs)) return [];
      return subs.filter(isPlainObject).map(c => ({
        _id: (typeof c._id === "string" && c._id) ? c._id : makeId(),
        corner_number: str(c.corner_number), name: str(c.name), start_m: str(c.start_m), end_m: str(c.end_m),
        brake_boards: editorBoards(c.brake_boards),
      }));
    }

    // One sub-corner per corner number with evenly spaced boundaries; names and boards kept by corner number.
    function splitSubCorners(start, end, nums, previous = []) {
      const s = Number(start);
      const step = (Number(end) - s) / nums.length;
      return nums.map((n, i) => {
        const old = previous.find(c => Number(c.corner_number) === n);
        return {
          _id: old ? old._id : makeId(), corner_number: String(n), name: old ? old.name : "",
          start_m: i === 0 ? str(start) : String(Math.round(s + step * i)),
          end_m: i === nums.length - 1 ? str(end) : String(Math.round(s + step * (i + 1))),
          brake_boards: old ? old.brake_boards : [],
        };
      });
    }

    // Keeps sub-corners tiling their segment when the segment's range or numbers change.
    function subCornersFollow(before, seg) {
      const subs = seg.sub_corners || [];
      if (subs.length === 0) return seg;
      let next = subs;
      if (seg.start_m !== before.start_m) next = next.map((c, i) => i === 0 ? { ...c, start_m: seg.start_m } : c);
      if (seg.end_m !== before.end_m) next = next.map((c, i) => i === next.length - 1 ? { ...c, end_m: seg.end_m } : c);
      if (seg.corner_numbers_raw !== before.corner_numbers_raw) {
        const nums = parseCornerNumbers(seg.corner_numbers_raw);
        if (nums.length === next.length && nums.every(Number.isInteger)) {
          next = next.map((c, i) => ({ ...c, corner_number: String(nums[i]) }));
        }
      }
      return next === subs ? seg : { ...seg, sub_corners: next };
    }

    function pickExtra(obj, known) {
      const out = {};
      for (const [k, v] of Object.entries(obj || {})) if (!known.has(k)) out[k] = v;
      return out;
    }

    function hasExtra(extra) {
      return isPlainObject(extra) && Object.keys(extra).length > 0;
    }

    // Sub-corners only mean something on a complex corner, so a type change drops them.
    function extraForType(extra, type) {
      const out = { ...extra };
      if (type !== "complex_corner") delete out.corners;
      return out;
    }

    // Keys in the order the source file had them, then any new keys.
    function orderKeys(obj, order) {
      const out = {};
      for (const k of order || []) if (k in obj) out[k] = obj[k];
      for (const k of Object.keys(obj)) if (!(k in out)) out[k] = obj[k];
      return out;
    }

    function makeSegment(prevEndM = 0, type = "corner") {
      return {
        _id: makeId(),
        type,
        name: "",
        start_m: prevEndM,
        end_m: prevEndM + 100,
        corner_number: "",
        corner_numbers_raw: "",
        brake_boards: [],
        sub_corners: [],
        _extra: {},
        _keyOrder: [],
      };
    }

    function parseCornerNumbers(raw) {
      return raw.split(",").map(s => s.trim()).filter(s => s !== "").map(Number);
    }

    function isIncreasingConsecutive(nums) {
      if (!Array.isArray(nums) || nums.length === 0) return false;
      for (let i = 1; i < nums.length; i++) {
        if (nums[i] !== nums[i - 1] + 1) return false;
      }
      return true;
    }

    // ─── Validation ─────────────────────────────────────────────────────────────

    // Sectors are required: Pits n' Giggles refuses to load a track file without them.
    function validateSectors(s1, s2, trackLength) {
      const errors = {};
      const s1n = Number(s1);
      const s2n = Number(s2);
      const tl = Number(trackLength);
      const hasTrackLen = trackLength !== "" && !isNaN(tl) && tl > 0;

      if (s1 === "" || isNaN(s1n)) {
        errors.s1 = "Required";
      } else if (!Number.isInteger(s1n)) {
        errors.s1 = "Must be an integer";
      } else if (s1n <= 0) {
        errors.s1 = "Must be > 0";
      }

      if (s2 === "" || isNaN(s2n)) {
        errors.s2 = "Required";
      } else if (!Number.isInteger(s2n)) {
        errors.s2 = "Must be an integer";
      } else if (!errors.s1 && s2n <= s1n) {
        errors.s2 = "Must be > S1";
      }

      if (hasTrackLen && !errors.s2 && s2n >= tl) {
        errors.s2 = `Must be < track_length (${tl})`;
      }

      return errors;
    }

    // Mirrors lib/track_segments_classifier: corners are numbered 1, 2, 3... in lap order.
    function cornerSequenceError(n, expected) {
      if (n === expected) return null;
      if (n < expected) return `Corner ${n} is a duplicate or out of order (expected ${expected})`;
      const missing = n - 1 === expected ? `${expected}` : `${expected}–${n - 1}`;
      return `Corner numbers must have no gaps: missing ${missing} before ${n}`;
    }

    // Mirrors lib/track_segments_classifier: every v2 lap distance is in [0, track_length).
    function lapPositionError(raw, trackLen, hasTrackLen) {
      if (raw === "" || raw === null || raw === undefined) return "Required";
      const n = Number(raw);
      if (!Number.isFinite(n)) return "Must be a number";
      if (n < 0) return "Must be ≥ 0";
      if (hasTrackLen && n >= trackLen) return `Must be < track_length (${trackLen})`;
      return null;
    }

    function rangeErrors(zone, trackLen, hasTrackLen) {
      const e = {};
      const s = lapPositionError(zone.start_m, trackLen, hasTrackLen);
      const en = lapPositionError(zone.end_m, trackLen, hasTrackLen);
      if (s) e.start_m = s;
      if (en) e.end_m = en;
      // end_m below start_m is allowed: the zone crosses the start line.
      if (!s && !en && Number(zone.start_m) === Number(zone.end_m)) e.end_m = "Must differ from start_m";
      return e;
    }

    function boardErrors(board, trackLen, hasTrackLen) {
      const e = {};
      if (!BOARD_DISTANCES.includes(str(board.distance_m))) e.distance_m = `Must be ${BOARD_DISTANCES.join(", ")}`;
      const at = lapPositionError(board.at_m, trackLen, hasTrackLen);
      if (at) e.at_m = at;
      if (!BOARD_SIDES.includes(board.side)) e.side = "Must be left, right or both";
      return e;
    }

    function boardListErrors(boards, trackLen, hasTrackLen) {
      const out = {};
      for (const b of boards || []) {
        const one = boardErrors(b, trackLen, hasTrackLen);
        if (hasMessages(one)) out[b._id] = one;
      }
      return out;
    }

    // Mirrors lib/track_segments_classifier: sub-corners match corner_numbers and tile the segment exactly.
    // Returns { general, subs: { [sub _id]: field errors } }.
    function subCornerErrors(seg, nums, trackLen, hasTrackLen) {
      const subs = seg.sub_corners || [];
      const out = { subs: {} };
      if (subs.length === 0) return out;
      const numbers = subs.map(c => Number(c.corner_number));
      if (numbers.length !== nums.length || numbers.some((n, i) => n !== nums[i])) {
        out.general = `Sub-corners are ${subs.map(c => "T" + c.corner_number).join(", ")}; they must match corner_numbers`;
      }
      subs.forEach((c, i) => {
        const e = {};
        const start = Number(c.start_m);
        const end = Number(c.end_m);
        const want = i === 0 ? Number(seg.start_m) : Number(subs[i - 1].end_m);
        if (c.start_m === "" || start !== want) {
          e.start_m = i === 0 ? `Must start at the segment start (${seg.start_m})` : `Must start where T${subs[i - 1].corner_number} ends`;
        }
        if (c.end_m === "" || !Number.isFinite(end)) e.end_m = "Required";
        else if (!(start < end)) e.end_m = "Must be greater than its start";
        else if (i === subs.length - 1 && end !== Number(seg.end_m)) e.end_m = `Must end at the segment end (${seg.end_m})`;
        const be = boardListErrors(c.brake_boards, trackLen, hasTrackLen);
        if (hasMessages(be)) e.brake_boards = be;
        if (hasMessages(e)) out.subs[c._id] = e;
      });
      return out;
    }

    function countMessages(v) {
      if (typeof v === "string") return 1;
      if (Array.isArray(v)) return v.reduce((n, x) => n + countMessages(x), 0);
      if (isPlainObject(v)) return Object.values(v).reduce((n, x) => n + countMessages(x), 0);
      return 0;
    }

    function hasMessages(obj) {
      return countMessages(obj) > 0;
    }

    // The v2 points and zones, and any top-level field Pits n' Giggles does not know.
    function validateMarkers({ speedTrap, drsZones, overtake, aeroZones, extraTop }, trackLength = "") {
      const trackLen = Number(trackLength);
      const hasTl = trackLength !== "" && !isNaN(trackLen) && trackLen > 0;
      const pos = raw => lapPositionError(raw, trackLen, hasTl);
      const errors = { drs: {}, aero: {}, top: [] };

      if (speedTrap !== "") {
        const m = pos(speedTrap);
        if (m) errors.speedTrap = m;
      }
      if (overtake) {
        const e = {};
        for (const f of ["detection_m", "activation_m"]) {
          const m = pos(overtake[f]);
          if (m) e[f] = m;
        }
        if (hasMessages(e)) errors.overtake = e;
      }
      drsZones.forEach(z => {
        const e = { acts: {} };
        const n = Number(z.id);
        if (z.id === "" || !Number.isInteger(n)) e.id = "Must be a whole number";
        else if (drsZones.filter(o => Number(o.id) === n).length > 1) e.id = "Duplicate id";
        const d = pos(z.detection_m);
        if (d) e.detection_m = d;
        if (z.activation.length === 0) e.activation = "Needs at least one activation range";
        z.activation.forEach(a => {
          const ae = rangeErrors(a, trackLen, hasTl);
          if (hasMessages(ae)) e.acts[a._id] = ae;
        });
        if (hasMessages(e)) errors.drs[z._id] = e;
      });
      aeroZones.forEach(z => {
        const e = rangeErrors(z, trackLen, hasTl);
        if (!AERO_MODES.includes(z.mode)) e.mode = "Must be full or partial";
        if (hasMessages(e)) errors.aero[z._id] = e;
      });
      for (const k of Object.keys(extraTop || {})) {
        errors.top.push(`Unknown field "${k}": Pits n' Giggles will refuse this file`);
      }
      return { errors, count: countMessages(errors) };
    }

    function validate(segments, trackLength = "") {
      const trackLen = Number(trackLength);
      const hasValidTrackLen = trackLength !== "" && !isNaN(trackLen) && trackLen > 0;
      const errors = {};
      let expectedCorner = 1;
      segments.forEach((seg, i) => {
        const e = {};
        // Kept, but Pits n' Giggles refuses any segment field it does not know.
        const unknown = Object.keys(seg._extra || {}).filter(k => k !== "segment_id");
        if (unknown.length) e.extra = `Unknown field "${unknown[0]}": Pits n' Giggles will refuse this file`;
        if (seg.type === "corner") {
          const be = boardListErrors(seg.brake_boards, trackLen, hasValidTrackLen);
          if (hasMessages(be)) e.brake_boards = be;
        }
        if (seg.type === "straight" && !seg.name.trim()) {
          e.name = "Required";
        }
        if (seg.start_m === "" || isNaN(Number(seg.start_m))) e.start_m = "Required";
        if (seg.end_m   === "" || isNaN(Number(seg.end_m)))   e.end_m   = "Required";
        if (!e.start_m && !e.end_m && Number(seg.start_m) >= Number(seg.end_m)) {
          e.end_m = "Must be greater than start_m";
        }
        if (seg.type === "corner") {
          const n = Number(seg.corner_number);
          if (seg.corner_number === "" || isNaN(n)) e.corner_number = "Required";
          else if (!Number.isInteger(n))            e.corner_number = "Must be an integer";
          else {
            const msg = cornerSequenceError(n, expectedCorner);
            if (msg) e.corner_number = msg;
            expectedCorner = Math.max(expectedCorner, n + 1);
          }
        }
        if (seg.type === "complex_corner") {
          const nums = parseCornerNumbers(seg.corner_numbers_raw);
          const allInts = nums.length > 0 && nums.every(n => Number.isInteger(n));
          if (nums.length === 0)                     e.corner_numbers = "Required, non-empty";
          else if (!allInts)                         e.corner_numbers = "All values must be integers";
          else if (nums.length < 2)                  e.corner_numbers = "Needs at least 2 corners (use a corner segment for one)";
          else if (!isIncreasingConsecutive(nums))   e.corner_numbers = "Must be increasing and consecutive (e.g. 5,6,7)";
          else {
            const msg = cornerSequenceError(nums[0], expectedCorner);
            if (msg) e.corner_numbers = msg;
          }
          if (allInts) expectedCorner = Math.max(expectedCorner, Math.max(...nums) + 1);
          if (!e.start_m && !e.end_m && allInts) {
            const se = subCornerErrors(seg, nums, trackLen, hasValidTrackLen);
            if (se.general) e.corners = se.general;
            if (hasMessages(se.subs)) e.sub_corners = se.subs;
          }
        }
        if (i > 0 && !e.start_m) {
          const prev = segments[i - 1];
          if (prev.end_m !== "" && !isNaN(Number(prev.end_m)) && Number(seg.start_m) < Number(prev.end_m)) {
            e.start_m = `Overlaps previous segment (prev end: ${prev.end_m})`;
          }
        }
        if (hasValidTrackLen && !e.start_m && Number(seg.start_m) < 0) {
          e.start_m = "Must be \u2265 0";
        }
        if (hasValidTrackLen && !e.end_m && Number(seg.end_m) > trackLen) {
          e.end_m = `Must be \u2264 track_length (${trackLen})`;
        }
        if (Object.keys(e).length > 0) errors[seg._id] = e;
      });
      return errors;
    }

    // ─── Reverse Track Generation ────────────────────────────────────────────────

    function generateReverseTrack(trackData, newName, newNumber) {
      const trackLen = trackData.track_length;
      const segs = [...trackData.segments].sort((a, b) => a.start_m - b.start_m);

      for (const seg of segs) {
        if (seg.start_m < 0 || seg.end_m > trackLen || seg.start_m >= seg.end_m) {
          throw new Error(`Segment "${seg.name || seg.type}" (${seg.start_m}–${seg.end_m}) is out of bounds or invalid.`);
        }
      }
      for (const seg of segs) {
        if (seg.type !== "complex_corner") continue;
        if (!Array.isArray(seg.corner_numbers) || seg.corner_numbers.length === 0) {
          throw new Error(`Complex corner "${seg.name || seg.type}" must have a non-empty corner_numbers array.`);
        }
        if (seg.corner_numbers.some(n => !Number.isInteger(n) || isNaN(n))) {
          throw new Error(`Complex corner "${seg.name || seg.type}" must use integer corner numbers.`);
        }
        if (!isIncreasingConsecutive(seg.corner_numbers)) {
          throw new Error(`Complex corner "${seg.name || seg.type}" must use increasing consecutive turn numbers.`);
        }
      }
      for (let i = 1; i < segs.length; i++) {
        if (segs[i].start_m < segs[i - 1].end_m) {
          throw new Error(`Segments overlap near ${segs[i - 1].end_m}m.`);
        }
      }

      let lastTurnNumber = 0;
      for (const seg of segs) {
        if (seg.type === "corner") lastTurnNumber = Math.max(lastTurnNumber, seg.corner_number);
        if (seg.type === "complex_corner") {
          for (const n of seg.corner_numbers) lastTurnNumber = Math.max(lastTurnNumber, n);
        }
      }

      const reversed = segs
        .map(seg => {
          const newSeg = { ...seg, start_m: trackLen - seg.end_m, end_m: trackLen - seg.start_m };
          if (lastTurnNumber > 0) {
            if (seg.type === "corner") {
              newSeg.corner_number = lastTurnNumber + 1 - seg.corner_number;
            } else if (seg.type === "complex_corner") {
              newSeg.corner_numbers = seg.corner_numbers.map(n => lastTurnNumber + 1 - n).reverse();
            }
          }
          return newSeg;
        })
        .reverse();

      const out = {
        circuit_name: newName,
        circuit_number: Number(newNumber),
        track_length: trackLen,
        segments: reversed,
      };
      // Mirrored sector boundaries are only a starting point for the reverse layout.
      if (trackData.sectors) {
        out.sectors = { s1: trackLen - trackData.sectors.s2, s2: trackLen - trackData.sectors.s1 };
      }
      return out;
    }

    // ─── Export / Import ─────────────────────────────────────────────────────────

    // Call as exportSegment(seg) or exportSegment(seg, false), never via .map(exportSegment):
    // map would pass the array index as includeExtra.
    function exportSegment(seg, includeExtra = true) {
      const out = { type: seg.type, start_m: Number(seg.start_m), end_m: Number(seg.end_m) };
      // Straights need a name; for the rest an empty one is left out, as lib/track_segments_classifier writes it.
      const name = seg.name.trim();
      if (seg.type === "straight" || name) out.name = name;
      if (seg.type === "corner") out.corner_number = Number(seg.corner_number);
      if (seg.type === "complex_corner") out.corner_numbers = parseCornerNumbers(seg.corner_numbers_raw);
      if (!includeExtra) return out;
      const exportBoards = boards => boards.map(b => ({ distance_m: Number(b.distance_m), at_m: Number(b.at_m), side: b.side }));
      const boards = seg.brake_boards || [];
      if (seg.type === "corner" && boards.length > 0) out.brake_boards = exportBoards(boards);
      const subs = seg.sub_corners || [];
      if (seg.type === "complex_corner" && subs.length > 0) {
        out.corners = subs.map(c => {
          const sub = { corner_number: Number(c.corner_number) };
          if (c.name.trim()) sub.name = c.name.trim();
          sub.start_m = Number(c.start_m);
          sub.end_m = Number(c.end_m);
          if (c.brake_boards.length > 0) sub.brake_boards = exportBoards(c.brake_boards);
          return sub;
        });
      }
      return orderKeys({ ...out, ...(seg._extra || {}) }, seg._keyOrder);
    }

    function importSegment(seg) {
      const extra = pickExtra(seg, KNOWN_SEG_KEYS);
      // Boards belong on corners and sub-corners on complex corners; elsewhere they are kept as unknown fields and flagged.
      if (seg.type !== "corner" && seg.brake_boards !== undefined) extra.brake_boards = seg.brake_boards;
      if (seg.type !== "complex_corner" && seg.corners !== undefined) extra.corners = seg.corners;
      return {
        _id: makeId(),
        type: seg.type,
        name: seg.name || "",
        start_m: seg.start_m ?? "",
        end_m: seg.end_m ?? "",
        corner_number: seg.corner_number ?? "",
        corner_numbers_raw: Array.isArray(seg.corner_numbers) ? seg.corner_numbers.join(", ") : "",
        brake_boards: seg.type === "corner" ? editorBoards(seg.brake_boards) : [],
        sub_corners: seg.type === "complex_corner" ? editorSubCorners(seg.corners) : [],
        _extra: extra,
        _keyOrder: Object.keys(seg),
      };
    }

    // The one place an exported file is built, used by Copy JSON and Download JSON.
    function buildPayload({ circuitName, circuitNumber, trackLength, segments, s1, s2, extraTop, topKeyOrder = [],
                            speedTrap = "", drsZones = [], overtake = null, aeroZones = [] }) {
      const known = {
        circuit_name: String(circuitName).trim(),
        circuit_number: Number(circuitNumber),
        track_length: Number(trackLength),
      };
      if (speedTrap !== "") known.speed_trap_m = Number(speedTrap);
      // Pits n' Giggles always writes both zone lists; a file that had neither keeps having neither.
      if (drsZones.length > 0 || topKeyOrder.includes("drs_zones")) {
        known.drs_zones = drsZones.map(z => ({
          id: Number(z.id), detection_m: Number(z.detection_m),
          activation: z.activation.map(a => ({ start_m: Number(a.start_m), end_m: Number(a.end_m) })),
        }));
      }
      if (overtake) {
        known.overtake_dist = { detection_m: Number(overtake.detection_m), activation_m: Number(overtake.activation_m) };
      }
      if (aeroZones.length > 0 || topKeyOrder.includes("active_aero_zones")) {
        known.active_aero_zones = aeroZones.map(z => ({ mode: z.mode, start_m: Number(z.start_m), end_m: Number(z.end_m) }));
      }
      known.segments = segments.map(seg => exportSegment(seg));
      known.sectors = { s1: Number(s1), s2: Number(s2) };
      return orderKeys({ ...known, ...(extraTop || {}) }, [...LIB_TOP_ORDER, ...topKeyOrder]);
    }

    // Lap positions the offset would not shift and the reverse would not mirror.
    function hasPositionData({ extraTop, segments, speedTrap, drsZones, overtake, aeroZones }) {
      return hasExtra(extraTop) || speedTrap !== "" || overtake !== null || drsZones.length > 0 || aeroZones.length > 0
        || segments.some(seg => hasExtra(seg._extra) || (seg.brake_boards || []).length > 0 || (seg.sub_corners || []).length > 0);
    }

    function unknownKeyError(obj, allowed, label) {
      if (!isPlainObject(obj)) return `${label} must be an object`;
      const bad = Object.keys(obj).find(k => !allowed.includes(k));
      return bad ? `${label}: unknown field "${bad}"` : null;
    }

    function loadedBoardsError(boards, label) {
      if (boards == null) return null;
      if (!Array.isArray(boards)) return `${label}: brake_boards must be an array`;
      for (let j = 0; j < boards.length; j++) {
        const err = unknownKeyError(boards[j], NESTED_KEYS.brake_board, `${label} brake_boards[${j}]`);
        if (err) return err;
      }
      return null;
    }

    // Rejects v2 data the editor could not show without losing part of it.
    function validateLoadedMarkers(data) {
      if (data.speed_trap_m != null && typeof data.speed_trap_m !== "number") return "speed_trap_m must be a number";
      if (data.drs_zones != null) {
        if (!Array.isArray(data.drs_zones)) return "drs_zones must be an array";
        for (let i = 0; i < data.drs_zones.length; i++) {
          const z = data.drs_zones[i];
          const err = unknownKeyError(z, NESTED_KEYS.drs_zone, `drs_zones[${i}]`);
          if (err) return err;
          if (!Array.isArray(z.activation)) return `drs_zones[${i}].activation must be an array`;
          for (let j = 0; j < z.activation.length; j++) {
            const aerr = unknownKeyError(z.activation[j], NESTED_KEYS.drs_activation, `drs_zones[${i}].activation[${j}]`);
            if (aerr) return aerr;
          }
        }
      }
      if (data.overtake_dist != null) {
        const err = unknownKeyError(data.overtake_dist, NESTED_KEYS.overtake_dist, "overtake_dist");
        if (err) return err;
      }
      if (data.active_aero_zones != null) {
        if (!Array.isArray(data.active_aero_zones)) return "active_aero_zones must be an array";
        for (let i = 0; i < data.active_aero_zones.length; i++) {
          const err = unknownKeyError(data.active_aero_zones[i], NESTED_KEYS.aero_zone, `active_aero_zones[${i}]`);
          if (err) return err;
        }
      }
      return null;
    }

    function validateLoadedData(data) {
      if (typeof data !== "object" || data === null) return "Root must be an object";
      if (typeof data.circuit_name !== "string" || !data.circuit_name.trim()) return "circuit_name must be a non-empty string";
      if (typeof data.circuit_number !== "number") return "circuit_number must be a number";
      if (!Array.isArray(data.segments)) return "segments must be an array";
      for (let i = 0; i < data.segments.length; i++) {
        const s = data.segments[i];
        if (!isPlainObject(s)) return `Segment ${i} must be an object`;
        if (!["straight", "corner", "complex_corner"].includes(s.type)) {
          return `Segment ${i}: unknown type "${s.type}"`;
        }
        const boardsErr = loadedBoardsError(s.brake_boards, `Segment ${i}`);
        if (boardsErr) return boardsErr;
        if (s.corners != null) {
          if (!Array.isArray(s.corners)) return `Segment ${i}: corners must be an array`;
          for (let j = 0; j < s.corners.length; j++) {
            const label = `Segment ${i} corners[${j}]`;
            const err = unknownKeyError(s.corners[j], NESTED_KEYS.sub_corner, label) || loadedBoardsError(s.corners[j].brake_boards, label);
            if (err) return err;
          }
        }
      }
      return validateLoadedMarkers(data);
    }

    const STORAGE_KEY = "track-segment-editor.state.v1";

    function normalizePersistedSegment(seg) {
      const type = ["straight", "corner", "complex_corner"].includes(seg?.type) ? seg.type : "corner";
      const extra = isPlainObject(seg?._extra) ? { ...seg._extra } : {};
      // Snapshots from before the editor knew brake boards and sub-corners kept them in _extra.
      let boards = seg?.brake_boards;
      if (!Array.isArray(boards) && type === "corner" && Array.isArray(extra.brake_boards)) {
        boards = extra.brake_boards;
        delete extra.brake_boards;
      }
      let subs = seg?.sub_corners;
      if (!Array.isArray(subs) && type === "complex_corner" && Array.isArray(extra.corners)) {
        subs = extra.corners;
        delete extra.corners;
      }
      return {
        _id: typeof seg?._id === "string" && seg._id ? seg._id : makeId(),
        type,
        name: typeof seg?.name === "string" ? seg.name : "",
        start_m: seg?.start_m ?? "",
        end_m: seg?.end_m ?? "",
        corner_number: seg?.corner_number ?? "",
        corner_numbers_raw: typeof seg?.corner_numbers_raw === "string" ? seg.corner_numbers_raw : "",
        brake_boards: editorBoards(boards),
        sub_corners: editorSubCorners(subs),
        _extra: extra,
        _keyOrder: Array.isArray(seg?._keyOrder) ? seg._keyOrder.filter(k => typeof k === "string") : [],
      };
    }

    function syncIdCounter(segments) {
      const maxCounter = segments.reduce((max, seg) => {
        const m = /^seg_(\d+)_/.exec(String(seg._id || ""));
        if (!m) return max;
        const n = Number(m[1]);
        return Number.isFinite(n) ? Math.max(max, n) : max;
      }, 0);
      if (maxCounter > _counter) _counter = maxCounter;
    }

    // ─── GitHub Track Source ────────────────────────────────────────────────────
    // Self-contained remote file source. Knows nothing about React or editor state.
    // Exposes the public pits-n-giggles repo's branches and track-segment JSON files.
    // Keeping this isolated leaves room for other sources (local files, etc.) later.

    const GitHubTrackSource = (() => {
      const OWNER = "ashwin-nat";
      const REPO = "pits-n-giggles";
      const TRACK_DIR = "assets/track-segments";
      const API = "https://api.github.com";

      class GitHubError extends Error {}

      async function ghFetch(url, opts = {}) {
        let res;
        try {
          res = await fetch(url, {
            ...opts,
            headers: { Accept: "application/vnd.github+json", ...(opts.headers || {}) },
          });
        } catch (err) {
          throw new GitHubError("GitHub or the network is unavailable. Check your connection and try again.");
        }
        if (res.status === 403 || res.status === 429) {
          if (res.headers.get("x-ratelimit-remaining") === "0") {
            throw new GitHubError("GitHub API rate limit reached (60 requests/hour for unauthenticated use). Please wait a while and try again.");
          }
          throw new GitHubError(`GitHub refused the request (HTTP ${res.status}).`);
        }
        if (res.status === 404) {
          throw new GitHubError("Not found on GitHub — the branch, folder, or file may have been moved or removed.");
        }
        if (!res.ok) {
          throw new GitHubError(`GitHub request failed (HTTP ${res.status}).`);
        }
        return res;
      }

      // Non-fatal: returns null if the repo metadata can't be read; caller falls back.
      async function getDefaultBranch() {
        try {
          const res = await ghFetch(`${API}/repos/${OWNER}/${REPO}`);
          const data = await res.json();
          return typeof data.default_branch === "string" ? data.default_branch : null;
        } catch (err) {
          if (err instanceof GitHubError) return null;
          throw err;
        }
      }

      async function listBranches() {
        const names = [];
        let url = `${API}/repos/${OWNER}/${REPO}/branches?per_page=100`;
        while (url) {
          const res = await ghFetch(url);
          const page = await res.json();
          if (!Array.isArray(page)) throw new GitHubError("Unexpected branch-list response from GitHub.");
          for (const b of page) if (b && typeof b.name === "string") names.push(b.name);
          const m = /<([^>]+)>;\s*rel="next"/.exec(res.headers.get("link") || "");
          url = m ? m[1] : null;
        }
        if (names.length === 0) throw new GitHubError("GitHub returned no branches for this repository.");
        return names;
      }

      async function listTracks(branch) {
        const res = await ghFetch(
          `${API}/repos/${OWNER}/${REPO}/contents/${TRACK_DIR}?ref=${encodeURIComponent(branch)}`
        );
        const entries = await res.json();
        if (!Array.isArray(entries)) {
          throw new GitHubError(`Could not read ${TRACK_DIR} on branch "${branch}".`);
        }
        return entries
          .filter(e => e && e.type === "file" && /\.json$/i.test(e.name))
          .map(e => ({ name: e.name, path: e.path, downloadUrl: e.download_url, sha: e.sha }))
          .sort((a, b) => a.name.localeCompare(b.name));
      }

      // Returns parsed JSON for the given track entry on the given branch.
      // Throws GitHubError on network / HTTP / parse failure (incl. file changed
      // or removed between listing and fetching -> 404).
      async function fetchTrack(track, branch) {
        let text;
        if (track.downloadUrl) {
          text = await (await ghFetch(track.downloadUrl)).text();
        } else {
          const res = await ghFetch(
            `${API}/repos/${OWNER}/${REPO}/contents/${track.path.split("/").map(encodeURIComponent).join("/")}?ref=${encodeURIComponent(branch)}`,
            { headers: { Accept: "application/vnd.github.raw+json" } }
          );
          text = await res.text();
        }
        try {
          return JSON.parse(text);
        } catch (err) {
          throw new GitHubError("The file returned by GitHub is not valid JSON.");
        }
      }

      return { OWNER, REPO, TRACK_DIR, GitHubError, getDefaultBranch, listBranches, listTracks, fetchTrack };
    })();

    // ─── Reducer ─────────────────────────────────────────────────────────────────

    const initialState = {
      circuitName: "",
      circuitNumber: "",
      trackLength: "",
      segments: [],
      autoAdjust: false,
      errors: {},
      loadModalOpen: false,
      githubModalOpen: false,
      loadedFileName: "",
      needsTrackLength: false,
      s1: "",
      s2: "",
      extraTop: {},
      topKeyOrder: [],
      speedTrap: "",
      drsZones: [],
      overtake: null,
      aeroZones: [],
    };

    function loadInitialState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return initialState;
        const parsed = JSON.parse(raw);
        if (typeof parsed !== "object" || parsed === null) return initialState;

        const segments = Array.isArray(parsed.segments)
          ? parsed.segments.map(normalizePersistedSegment)
          : [];

        syncIdCounter(segments);

        const trackLength = (typeof parsed.trackLength === "string" || typeof parsed.trackLength === "number")
          ? String(parsed.trackLength)
          : "";

        // Snapshots from before the editor knew the v2 points and zones kept them in extraTop.
        const extraTop = isPlainObject(parsed.extraTop) ? { ...parsed.extraTop } : {};
        const markers = "drsZones" in parsed ? editorMarkers(parsed) : markersFromFile(extraTop);
        for (const k of ["speed_trap_m", "drs_zones", "overtake_dist", "active_aero_zones"]) delete extraTop[k];

        return {
          ...initialState,
          circuitName: typeof parsed.circuitName === "string" ? parsed.circuitName : "",
          circuitNumber: (typeof parsed.circuitNumber === "string" || typeof parsed.circuitNumber === "number")
            ? parsed.circuitNumber
            : "",
          trackLength,
          segments,
          autoAdjust: typeof parsed.autoAdjust === "boolean" ? parsed.autoAdjust : false,
          errors: validate(segments, trackLength),
          s1: (typeof parsed.s1 === "string" || typeof parsed.s1 === "number") ? String(parsed.s1) : "",
          s2: (typeof parsed.s2 === "string" || typeof parsed.s2 === "number") ? String(parsed.s2) : "",
          extraTop,
          topKeyOrder: Array.isArray(parsed.topKeyOrder) ? parsed.topKeyOrder.filter(k => typeof k === "string") : [],
          ...markers,
        };
      } catch (err) {
        console.warn("Failed to restore saved editor state:", err);
        return initialState;
      }
    }

    function reducer(state, action) {
      let segments = state.segments;
      switch (action.type) {
        case "SET_CIRCUIT_NAME":
          return { ...state, circuitName: action.value };
        case "SET_CIRCUIT_NUMBER":
          return { ...state, circuitNumber: action.value };
        case "TOGGLE_AUTO_ADJUST":
          return { ...state, autoAdjust: !state.autoAdjust };
        case "SET_S1":
          return { ...state, s1: action.value };
        case "SET_S2":
          return { ...state, s2: action.value };
        // value: any of { speedTrap, drsZones, overtake, aeroZones }, validated in App like the sectors.
        case "SET_MARKERS":
          return { ...state, ...action.value };

        case "SET_BRAKE_BOARDS": {
          const updated = segments.map(s => s._id === action.id ? { ...s, brake_boards: action.boards } : s);
          return { ...state, segments: updated, errors: validate(updated, state.trackLength) };
        }

        case "SET_SUB_CORNERS": {
          const updated = segments.map(s => s._id === action.id ? { ...s, sub_corners: action.subs } : s);
          return { ...state, segments: updated, errors: validate(updated, state.trackLength) };
        }

        case "UPDATE_SEGMENT": {
          const { id, field, value } = action;
          let updated = segments.map(s => s._id === id ? { ...s, [field]: value } : s);
          if (state.autoAdjust && field === "end_m" && value !== "") {
            const idx = updated.findIndex(s => s._id === id);
            if (idx !== -1 && idx < updated.length - 1) {
              updated = updated.map((s, i) => i === idx + 1 ? { ...s, start_m: value } : s);
            }
          }
          updated = updated.map((s, i) => s === segments[i] ? s : subCornersFollow(segments[i], s));
          return { ...state, segments: updated, errors: validate(updated, state.trackLength) };
        }

        case "CHANGE_TYPE": {
          const updated = segments.map(s => s._id !== action.id ? s : {
            _id: s._id, type: action.newType, name: s.name,
            start_m: s.start_m, end_m: s.end_m, corner_number: "", corner_numbers_raw: "",
            brake_boards: action.newType === "corner" ? (s.brake_boards || []) : [],
            sub_corners: action.newType === "complex_corner" ? (s.sub_corners || []) : [],
            _extra: extraForType(s._extra, action.newType), _keyOrder: s._keyOrder,
          });
          return { ...state, segments: updated, errors: validate(updated, state.trackLength) };
        }

        case "INSERT_ABOVE": {
          const idx = segments.findIndex(s => s._id === action.id);
          if (idx === -1) return state;
          const prevEndM = idx > 0 ? (Number(segments[idx-1].end_m) || 0) : 0;
          const updated = [...segments.slice(0, idx), makeSegment(prevEndM), ...segments.slice(idx)];
          return { ...state, segments: updated, errors: validate(updated, state.trackLength) };
        }

        case "INSERT_BELOW": {
          const idx = segments.findIndex(s => s._id === action.id);
          if (idx === -1) return state;
          const updated = [...segments.slice(0, idx+1), makeSegment(Number(segments[idx].end_m)||0), ...segments.slice(idx+1)];
          return { ...state, segments: updated, errors: validate(updated, state.trackLength) };
        }

        case "ADD_FIRST": {
          const newSeg = makeSegment(0);
          return { ...state, segments: [newSeg], errors: validate([newSeg], state.trackLength) };
        }

        case "ADD_LAST": {
          const last = segments[segments.length - 1];
          const newSeg = makeSegment(last ? (Number(last.end_m) || 0) : 0);
          const updated = [...segments, newSeg];
          return { ...state, segments: updated, errors: validate(updated, state.trackLength) };
        }

        case "MOVE_UP": {
          const idx = segments.findIndex(s => s._id === action.id);
          if (idx <= 0) return state;
          const updated = [...segments];
          [updated[idx-1], updated[idx]] = [updated[idx], updated[idx-1]];
          return { ...state, segments: updated, errors: validate(updated, state.trackLength) };
        }

        case "MOVE_DOWN": {
          const idx = segments.findIndex(s => s._id === action.id);
          if (idx === -1 || idx >= segments.length - 1) return state;
          const updated = [...segments];
          [updated[idx], updated[idx+1]] = [updated[idx+1], updated[idx]];
          return { ...state, segments: updated, errors: validate(updated, state.trackLength) };
        }

        case "DELETE": {
          const updated = segments.filter(s => s._id !== action.id);
          return { ...state, segments: updated, errors: validate(updated, state.trackLength) };
        }

        case "LOAD_JSON": {
          const loaded = action.data.segments.map(importSegment);
          const trackLength = action.data.track_length != null ? String(action.data.track_length) : "";
          const loadedSectors = action.data.sectors;
          const hasSectors = loadedSectors != null
            && typeof loadedSectors.s1 === "number"
            && typeof loadedSectors.s2 === "number";
          return {
            ...state,
            circuitName: action.data.circuit_name,
            circuitNumber: action.data.circuit_number,
            trackLength,
            needsTrackLength: trackLength === "",
            segments: loaded,
            errors: validate(loaded, trackLength),
            loadModalOpen: false,
            githubModalOpen: false,
            loadedFileName: action.fileName || "",
            s1: hasSectors ? String(loadedSectors.s1) : "",
            s2: hasSectors ? String(loadedSectors.s2) : "",
            extraTop: pickExtra(action.data, KNOWN_TOP_KEYS),
            topKeyOrder: Object.keys(action.data),
            ...markersFromFile(action.data),
          };
        }

        case "SET_TRACK_LENGTH": {
          const tl = action.value;
          return { ...state, trackLength: tl, needsTrackLength: false, errors: validate(state.segments, tl) };
        }

        case "CLEAR_NEEDS_TRACK_LENGTH":
          return { ...state, needsTrackLength: false };

        case "NEW":
          return { ...initialState };

        case "OPEN_LOAD_MODAL":
          return { ...state, loadModalOpen: true };

        case "CLOSE_LOAD_MODAL":
          return { ...state, loadModalOpen: false };

        case "OPEN_GITHUB_MODAL":
          return { ...state, githubModalOpen: true };

        case "CLOSE_GITHUB_MODAL":
          return { ...state, githubModalOpen: false };

        case "APPLY_OFFSET": {
          const { offset, trackLen } = action;
          const updated = segments.map(s => {
            if (s.start_m === "" || s.end_m === "" || isNaN(Number(s.start_m)) || isNaN(Number(s.end_m))) return s;
            const newStart = ((Number(s.start_m) + offset) % trackLen + trackLen) % trackLen;
            const newEnd   = ((Number(s.end_m)   + offset) % trackLen + trackLen) % trackLen;
            return { ...s, start_m: String(+newStart.toFixed(3)), end_m: String(+newEnd.toFixed(3)) };
          });
          return { ...state, segments: updated, errors: validate(updated, state.trackLength) };
        }

        default:
          return state;
      }
    }

    // ─── Components ──────────────────────────────────────────────────────────────

    function FieldError({ msg }) {
      if (!msg) return null;
      return <p className="text-xs text-red-400 mt-0.5">{msg}</p>;
    }

    function inputCls(hasError) {
      return `w-full border rounded px-2 py-1 text-sm bg-zinc-800 text-white placeholder-zinc-500 focus:outline-none focus:ring-1 ${
        hasError ? "border-red-500 focus:ring-red-500" : "border-zinc-600 focus:ring-red-500"
      }`;
    }

    // Icon-only header button with a themed hover/focus tooltip.
    function IconButton({ icon, label, onClick, variant = "default" }) {
      const variants = {
        default: "border border-zinc-700 text-zinc-300 hover:border-zinc-400 hover:text-white",
        danger:  "border border-zinc-700 text-zinc-300 hover:border-red-600 hover:text-red-400",
        primary: "bg-red-600 text-white hover:bg-red-700",
      };
      return (
        <span className="relative group inline-flex">
          <button
            onClick={onClick}
            aria-label={label}
            className={`w-9 h-8 flex items-center justify-center rounded transition-colors ${variants[variant]}`}
          >
            <i className={`bi ${icon} text-base`} />
          </button>
          <span
            role="tooltip"
            className="pointer-events-none absolute top-full left-1/2 -translate-x-1/2 mt-1.5 z-40 whitespace-nowrap rounded border border-zinc-700 bg-zinc-900 px-2 py-1 text-xs font-normal text-zinc-100 shadow-lg opacity-0 translate-y-[-2px] transition-all duration-150 group-hover:opacity-100 group-hover:translate-y-0 group-focus-within:opacity-100 group-focus-within:translate-y-0"
          >
            {label}
          </span>
        </span>
      );
    }

    // Small "info" glyph with a themed hover/focus tooltip for longer help text.
    function InfoHint({ text, className = "" }) {
      return (
        <span className={`relative group inline-flex align-middle ${className}`}>
          <i
            tabIndex={0}
            role="img"
            aria-label={text}
            className="bi bi-info-circle text-sm text-zinc-500 hover:text-zinc-300 focus:text-zinc-300 focus:outline-none cursor-help transition-colors"
          />
          <span
            role="tooltip"
            className="pointer-events-none absolute top-full left-0 mt-1.5 z-50 w-64 whitespace-pre-line break-words rounded border border-zinc-700 bg-zinc-900 px-2.5 py-1.5 text-xs font-normal normal-case tracking-normal leading-snug text-zinc-100 shadow-xl opacity-0 translate-y-[-2px] transition-all duration-150 group-hover:opacity-100 group-hover:translate-y-0 group-focus-within:opacity-100 group-focus-within:translate-y-0"
          >
            {text}
          </span>
        </span>
      );
    }

    const SMALL_BTN = "px-2 py-0.5 border border-zinc-700 rounded text-xs text-zinc-400 hover:border-red-600 hover:text-red-400 transition-colors";

    function smallInputCls(hasError, width) {
      return `border rounded px-2 py-1 text-sm bg-zinc-800 text-white ${width} focus:outline-none focus:ring-1 focus:ring-red-500 placeholder-zinc-600 ${
        hasError ? "border-red-500" : "border-zinc-600"
      }`;
    }

    // A lap distance input with its error under it.
    function NumField({ label, value, error, onChange, placeholder, width = "w-24" }) {
      // Fixed width so a long error wraps instead of pushing the row's other fields sideways.
      return (
        <div className={width}>
          {label && <label className="block text-xs text-zinc-500 mb-0.5">{label}</label>}
          <input type="number" step="any" value={value} placeholder={placeholder}
            className={smallInputCls(!!error, width)}
            onChange={e => onChange(e.target.value)} />
          <FieldError msg={error} />
        </div>
      );
    }

    // A fixed-choice select. A loaded value outside the choices stays visible, so its error makes sense.
    function ChoiceField({ label, value, options, error, onChange, format = v => v }) {
      return (
        <div>
          {label && <label className="block text-xs text-zinc-500 mb-0.5">{label}</label>}
          <select value={value} className={smallInputCls(!!error, "")} onChange={e => onChange(e.target.value)}>
            {!options.includes(value) && <option value={value}>{value || "–"}</option>}
            {options.map(o => <option key={o} value={o}>{format(o)}</option>)}
          </select>
          <FieldError msg={error} />
        </div>
      );
    }

    function RemoveButton({ onClick, label }) {
      return (
        <button onClick={onClick} title={label} aria-label={label}
          className="mt-0.5 px-1.5 py-0.5 border border-zinc-700 rounded text-xs text-zinc-500 hover:border-red-600 hover:text-red-500 transition-colors">
          <i className="bi bi-x-lg" />
        </button>
      );
    }

    // A collapsible box inside a card. Collapsed by default; one that starts with errors starts open.
    function SubBox({ title, count, issues, hint, actions, open, setOpen, children }) {
      return (
        <div className={`mt-2 rounded border ${issues ? "border-red-800" : "border-zinc-800"}`} style={{ backgroundColor: "#141414" }}>
          <div className="flex flex-wrap items-center gap-2 px-2 py-1">
            <button onClick={() => setOpen(o => !o)} className="flex items-center gap-1.5 text-xs font-medium text-zinc-400 hover:text-zinc-200">
              <i className={`bi ${open ? "bi-chevron-down" : "bi-chevron-right"}`} />
              {title} <span className="font-normal text-zinc-500">({count})</span>
            </button>
            {issues > 0 && (
              <span className="text-xs bg-red-950 text-red-400 px-1.5 py-0.5 rounded-full font-medium border border-red-800">{issues}!</span>
            )}
            {hint && <InfoHint text={hint} />}
            <div className="ml-auto flex gap-1">{actions}</div>
          </div>
          {open && <div className="px-2 pb-1.5">{children}</div>}
        </div>
      );
    }

    function BrakeBoards({ boards, errors, onChange }) {
      const issues = countMessages(errors);
      const [open, setOpen] = useState(() => issues > 0);
      const add = () => {
        onChange([...boards, { _id: makeId(), distance_m: "100", at_m: "", side: "left" }]);
        setOpen(true);
      };
      return (
        <SubBox title="Brake boards" count={boards.length} issues={issues} open={open} setOpen={setOpen}
          hint={"Each row: distance on the board, at_m (where the board stands on the lap, not where it points to), side.\n\nBoards do not move when the corner does."}
          actions={<button onClick={add} className={SMALL_BTN}>+ Board</button>}>
          {boards.map(b => {
            const e = errors[b._id] || {};
            return (
              <div key={b._id} className="flex flex-wrap items-start gap-2 mb-1">
                <ChoiceField value={b.distance_m} options={BOARD_DISTANCES} error={e.distance_m} format={d => `${d} m`}
                  onChange={v => onChange(replaceById(boards, b._id, { distance_m: v }))} />
                <NumField value={b.at_m} error={e.at_m} placeholder="at_m"
                  onChange={v => onChange(replaceById(boards, b._id, { at_m: v }))} />
                <ChoiceField value={b.side} options={BOARD_SIDES} error={e.side}
                  onChange={v => onChange(replaceById(boards, b._id, { side: v }))} />
                <RemoveButton label="Remove board" onClick={() => onChange(removeById(boards, b._id))} />
              </div>
            );
          })}
        </SubBox>
      );
    }

    // A complex corner's sub-corners, each with a name and its own boards. They always tile the segment:
    // a sub-corner's end is the next one's start, and the first start and last end follow the segment.
    function SubCorners({ seg, errors, dispatch }) {
      const subs = seg.sub_corners || [];
      const subErrors = errors.sub_corners || {};
      const issues = countMessages(subErrors) + (errors.corners ? 1 : 0);
      const [open, setOpen] = useState(() => issues > 0);
      const set = list => dispatch({ type: "SET_SUB_CORNERS", id: seg._id, subs: list });

      const nums = parseCornerNumbers(seg.corner_numbers_raw);
      const numsOk = nums.length >= 2 && nums.every(Number.isInteger) && isIncreasingConsecutive(nums);
      const rangeOk = seg.start_m !== "" && seg.end_m !== "" && Number(seg.start_m) < Number(seg.end_m);
      const mismatch = subs.length > 0 && numsOk
        && (subs.length !== nums.length || subs.some((c, i) => Number(c.corner_number) !== nums[i]));
      const boardCount = subs.reduce((n, c) => n + c.brake_boards.length, 0);
      const split = () => { set(splitSubCorners(seg.start_m, seg.end_m, nums, subs)); setOpen(true); };
      const setEnd = (i, v) => set(subs.map((c, j) => j === i ? { ...c, end_m: v } : j === i + 1 ? { ...c, start_m: v } : c));

      const actions = <>
        {subs.length === 0 && (
          <button onClick={split} disabled={!numsOk || !rangeOk} className={`${SMALL_BTN} disabled:opacity-30 disabled:cursor-not-allowed`}
            title={numsOk && rangeOk ? "One sub-corner per corner number, evenly spaced" : "Needs valid corner_numbers, start_m and end_m"}>
            Split into sub-corners
          </button>
        )}
        {mismatch && rangeOk && (
          <button onClick={split} className={SMALL_BTN} title="Matches corner_numbers again, boundaries evenly spaced; names and boards kept by corner number">
            Rebuild from corner_numbers
          </button>
        )}
        {subs.length > 0 && (
          <button className={SMALL_BTN} onClick={() => {
            if (boardCount === 0 || window.confirm(`Remove ${subs.length} sub-corners and their ${boardCount} brake board(s)?`)) set([]);
          }}>
            {boardCount > 0 ? `Remove sub-corners and ${boardCount} board${boardCount > 1 ? "s" : ""}` : "Remove sub-corners"}
          </button>
        )}
      </>;

      return (
        <SubBox title="Sub-corners" count={subs.length} issues={issues} open={open} setOpen={setOpen} actions={actions}
          hint={"Optional. Splits a complex corner into one part per corner number, so each can carry its own name and brake boards.\n\nA complex corner is one braking event, so its boards usually go on the first sub-corner.\n\nBoundaries move together: changing a sub-corner's end moves the next one's start."}>
          <FieldError msg={errors.corners} />
          {subs.length === 0 && (
            <p className="text-xs text-zinc-500">No sub-corners. A complex corner carries brake boards only through its sub-corners.</p>
          )}
          {subs.map((c, i) => {
            const e = subErrors[c._id] || {};
            const last = i === subs.length - 1;
            return (
              <div key={c._id} className="mb-2 pl-2 border-l border-zinc-700">
                <div className="flex flex-wrap items-start gap-2">
                  <span className="text-sm font-mono text-zinc-300 pt-1 w-10">T{c.corner_number}</span>
                  <input type="text" value={c.name} placeholder="name (opt)"
                    className={smallInputCls(false, "w-40")}
                    onChange={ev => set(replaceById(subs, c._id, { name: ev.target.value }))} />
                  <span className="text-sm text-zinc-400 pt-1 font-mono">{c.start_m} {"→"}</span>
                  {last ? (
                    <span className="text-sm text-zinc-400 pt-1 font-mono">{c.end_m} <span className="text-xs text-zinc-600">(segment end)</span></span>
                  ) : (
                    <NumField value={c.end_m} error={e.end_m} placeholder="end_m" onChange={v => setEnd(i, v)} />
                  )}
                </div>
                <FieldError msg={e.start_m} />
                {last && <FieldError msg={e.end_m} />}
                <BrakeBoards boards={c.brake_boards} errors={e.brake_boards || {}}
                  onChange={list => set(replaceById(subs, c._id, { brake_boards: list }))} />
              </div>
            );
          })}
        </SubBox>
      );
    }

    function TypeSpecificFields({ seg, errors, dispatch }) {
      if (seg.type === "corner") {
        return (
          <div className="mt-1.5">
            <label className="block text-xs font-medium text-zinc-500 mb-0.5">
              corner_number <span className="text-red-500">*</span>
            </label>
            <input
              type="number"
              value={seg.corner_number}
              className={`border rounded px-2 py-1 text-sm bg-zinc-800 text-white w-20 focus:outline-none focus:ring-1 ${errors.corner_number ? "border-red-500 focus:ring-red-500" : "border-zinc-600 focus:ring-red-500"}`}
              onChange={e => dispatch({ type: "UPDATE_SEGMENT", id: seg._id, field: "corner_number", value: e.target.value })}
            />
            <FieldError msg={errors.corner_number} />
            <BrakeBoards boards={seg.brake_boards || []} errors={errors.brake_boards || {}}
              onChange={list => dispatch({ type: "SET_BRAKE_BOARDS", id: seg._id, boards: list })} />
          </div>
        );
      }

      if (seg.type === "complex_corner") {
        const nums = parseCornerNumbers(seg.corner_numbers_raw);
        return (
          <div className="mt-1.5">
            <label className="block text-xs font-medium text-zinc-500 mb-0.5">
              corner_numbers <span className="text-red-500">*</span>{" "}
              <span className="font-normal text-zinc-600">(comma-separated increasing consecutive integers, e.g. 5,6,7)</span>
            </label>
            <input
              type="text"
              value={seg.corner_numbers_raw}
              placeholder="5,6,7"
              className={inputCls(!!errors.corner_numbers)}
              onChange={e => dispatch({ type: "UPDATE_SEGMENT", id: seg._id, field: "corner_numbers_raw", value: e.target.value })}
            />
            <FieldError msg={errors.corner_numbers} />
            <SubCorners seg={seg} errors={errors} dispatch={dispatch} />
          </div>
        );
      }

      return null;
    }

    // Track-level v2 data: the speed trap, then the F1 26 items (overtake, active aero) and the F1 25 / F2 ones (DRS).
    function MarkersPanel({ markers, errors, dispatch }) {
      const { speedTrap, drsZones, overtake, aeroZones } = markers;
      const [open, setOpen] = useState(true);
      const set = value => dispatch({ type: "SET_MARKERS", value });
      const issues = countMessages(errors);
      const f126Issues = countMessages(errors.overtake) + countMessages(errors.aero);
      const drsIssues = countMessages(errors.drs);
      const [f126Open, setF126Open] = useState(() => f126Issues > 0);
      const [drsOpen, setDrsOpen] = useState(() => drsIssues > 0);
      const nextDrsId = drsZones.reduce((m, z) => Math.max(m, Number(z.id) || 0), 0) + 1;
      const summary = [
        speedTrap !== "" && "speed trap",
        overtake && "overtake",
        drsZones.length > 0 && `${drsZones.length} DRS`,
        aeroZones.length > 0 && `${aeroZones.length} active aero`,
      ].filter(Boolean).join(" · ") || "none";
      const title = t => <h3 className="text-xs font-semibold uppercase tracking-wide text-zinc-400 mb-1">{t}</h3>;

      return (
        <div className="flex items-start gap-2 mb-4">
          <div className="w-7 flex-shrink-0" />
          <section className={`flex-1 rounded-lg border-l-4 ${issues ? "border-red-500" : "border-zinc-700"}`} style={{ backgroundColor: "#1a1a1a" }}>
            <button onClick={() => setOpen(o => !o)} className="w-full flex items-center gap-2 px-3 py-2 text-left">
              <span className="text-sm font-medium text-zinc-200">Zones and points</span>
              <span className="text-xs text-zinc-500">{summary}</span>
              {issues > 0 && (
                <span className="text-xs bg-red-950 text-red-400 px-1.5 py-0.5 rounded-full font-medium border border-red-800">{issues}!</span>
              )}
              <i className={`bi ${open ? "bi-chevron-up" : "bi-chevron-down"} ml-auto text-zinc-400`} />
            </button>

            {open && (
              <div className="px-3 pb-3 space-y-3">
                {errors.top.map(m => <FieldError key={m} msg={m} />)}
                <p className="text-xs text-zinc-600">
                  Lap distances in metres, 0 up to track_length. A zone may cross the start line: end_m below start_m.
                  Nothing here moves when segments do.
                </p>

                <div>
                  {title("Speed trap")}
                  <NumField value={speedTrap} error={errors.speedTrap} placeholder="none"
                    onChange={v => set({ speedTrap: v })} />
                </div>

                <SubBox title="F1 26" count={(overtake ? 1 : 0) + aeroZones.length} issues={f126Issues}
                  open={f126Open} setOpen={setF126Open} hint={"Overtake mode and active aero. Only F1 26 sessions use them."}>
                <div className="space-y-3 pt-1">
                <div>
                  {title("Overtake")}
                  {overtake ? (
                    <div className="flex flex-wrap items-start gap-2">
                      <NumField label="detection_m" value={overtake.detection_m} error={errors.overtake?.detection_m}
                        onChange={v => set({ overtake: { ...overtake, detection_m: v } })} />
                      <NumField label="activation_m" value={overtake.activation_m} error={errors.overtake?.activation_m}
                        onChange={v => set({ overtake: { ...overtake, activation_m: v } })} />
                      <div className="pt-4"><RemoveButton label="Remove overtake" onClick={() => set({ overtake: null })} /></div>
                    </div>
                  ) : (
                    <button onClick={() => set({ overtake: { detection_m: "", activation_m: "" } })} className={SMALL_BTN}>+ Overtake</button>
                  )}
                </div>

                <div>
                  {title("Active aero zones (mode, start_m, end_m)")}
                  {aeroZones.map(z => {
                    const e = errors.aero[z._id] || {};
                    const update = patch => set({ aeroZones: replaceById(aeroZones, z._id, patch) });
                    return (
                      <div key={z._id} className="flex flex-wrap items-start gap-2 mb-1">
                        <ChoiceField value={z.mode} options={AERO_MODES} error={e.mode} onChange={v => update({ mode: v })} />
                        <NumField value={z.start_m} error={e.start_m} placeholder="start_m" onChange={v => update({ start_m: v })} />
                        <NumField value={z.end_m} error={e.end_m} placeholder="end_m" onChange={v => update({ end_m: v })} />
                        <RemoveButton label="Remove zone" onClick={() => set({ aeroZones: removeById(aeroZones, z._id) })} />
                      </div>
                    );
                  })}
                  <button className={SMALL_BTN} onClick={() => set({ aeroZones: [...aeroZones, {
                    _id: makeId(), mode: "full", start_m: "", end_m: "",
                  }] })}>+ Aero zone</button>
                </div>
                </div>
                </SubBox>

                <SubBox title="F1 25 and F2" count={drsZones.length} issues={drsIssues}
                  open={drsOpen} setOpen={setDrsOpen} hint={"DRS zones. F1 25 and F2 sessions use them; F1 26 has overtake mode instead."}>
                <div className="pt-1">
                  {title("DRS zones")}
                  {drsZones.map(z => {
                    const e = errors.drs[z._id] || { acts: {} };
                    const update = patch => set({ drsZones: replaceById(drsZones, z._id, patch) });
                    return (
                      <div key={z._id} className="mb-2 pl-2 border-l border-zinc-700">
                        <div className="flex flex-wrap items-start gap-2">
                          <NumField label="id" value={z.id} error={e.id} width="w-16" onChange={v => update({ id: v })} />
                          <NumField label="detection_m" value={z.detection_m} error={e.detection_m}
                            onChange={v => update({ detection_m: v })} />
                          <div className="pt-4"><RemoveButton label="Remove DRS zone" onClick={() => set({ drsZones: removeById(drsZones, z._id) })} /></div>
                        </div>
                        <div className="mt-1">
                          <span className="text-xs text-zinc-500 mr-2">activation (start_m, end_m)</span>
                          <button onClick={() => update({ activation: [...z.activation, { _id: makeId(), start_m: "", end_m: "" }] })}
                            className={SMALL_BTN}>+ Range</button>
                          <FieldError msg={e.activation} />
                          {z.activation.map(a => {
                            const ae = (e.acts || {})[a._id] || {};
                            const updateAct = patch => update({ activation: replaceById(z.activation, a._id, patch) });
                            return (
                              <div key={a._id} className="flex flex-wrap items-start gap-2 mt-1">
                                <NumField value={a.start_m} error={ae.start_m} placeholder="start_m" onChange={v => updateAct({ start_m: v })} />
                                <NumField value={a.end_m} error={ae.end_m} placeholder="end_m" onChange={v => updateAct({ end_m: v })} />
                                <RemoveButton label="Remove range" onClick={() => update({ activation: removeById(z.activation, a._id) })} />
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                  <button className={SMALL_BTN} onClick={() => set({ drsZones: [...drsZones, {
                    _id: makeId(), id: String(nextDrsId), detection_m: "", activation: [{ _id: makeId(), start_m: "", end_m: "" }],
                  }] })}>+ DRS zone</button>
                </div>
                </SubBox>
              </div>
            )}
          </section>
        </div>
      );
    }

    function offsetDisplay(value, offset, trackLen) {
      const raw = Number(value);
      if (isNaN(raw) || offset === 0 || !trackLen) return null;
      return +( ((raw + offset) % trackLen + trackLen) % trackLen ).toFixed(1);
    }

    function SegmentCard({ seg, segNum, index, total, errors, dispatch, animTick, cardRef, offset, trackLengthNum }) {
      const e = errors[seg._id] || {};
      const hasError = Object.keys(e).length > 0;
      const isMoving = animTick > 0;

      return (
        <div ref={cardRef} className="flex items-start gap-2 mb-1.5">
          {/* Segment number */}
          <div className="flex-shrink-0 w-7 pt-2 text-right">
            <span className="text-zinc-600 text-xs font-mono font-bold">{String(segNum).padStart(2, "0")}</span>
          </div>

          {/* Card */}
          <div
            className={`relative flex-1 rounded-lg border-l-4 overflow-hidden ${isMoving ? "seg-moving" : ""} ${
              hasError ? "border-red-500" : "border-zinc-700"
            }`}
            style={{ backgroundColor: "#1a1a1a" }}
          >
            {isMoving && (
              <div key={animTick} className="seg-flash-overlay absolute inset-0 pointer-events-none z-10 rounded-lg" />
            )}
            <div className="px-3 py-2">
              {/* Grid: row 1 = labels, row 2 = inputs — guarantees perfect alignment */}
              <div className="grid gap-x-2 gap-y-0.5 items-center" style={{ gridTemplateColumns: "auto 1fr 6rem 6rem auto" }}>
                {/* Labels row */}
                <label className="text-xs font-medium text-zinc-500">Type</label>
                <label className="text-xs font-medium text-zinc-500">
                  Name{" "}
                  {seg.type === "straight"
                    ? <span className="text-red-500">*</span>
                    : <span className="font-normal text-zinc-600">(opt)</span>
                  }
                </label>
                <label className="text-xs font-medium text-zinc-500">start_m <span className="text-red-500">*</span></label>
                <label className="text-xs font-medium text-zinc-500">end_m <span className="text-red-500">*</span></label>
                <div />

                {/* Inputs row */}
                <select
                  value={seg.type}
                  className="border border-zinc-600 rounded px-2 py-1 text-sm bg-zinc-800 text-white focus:outline-none focus:ring-1 focus:ring-red-500"
                  onChange={e => dispatch({ type: "CHANGE_TYPE", id: seg._id, newType: e.target.value })}
                >
                  <option value="straight">straight</option>
                  <option value="corner">corner</option>
                  <option value="complex_corner">complex_corner</option>
                </select>
                <input
                  type="text"
                  value={seg.name}
                  className={inputCls(!!e.name)}
                  onChange={ev => dispatch({ type: "UPDATE_SEGMENT", id: seg._id, field: "name", value: ev.target.value })}
                />
                <input
                  type="number"
                  value={seg.start_m}
                  className={inputCls(!!e.start_m)}
                  onChange={ev => dispatch({ type: "UPDATE_SEGMENT", id: seg._id, field: "start_m", value: ev.target.value })}
                />
                <input
                  type="number"
                  value={seg.end_m}
                  className={inputCls(!!e.end_m)}
                  onChange={ev => dispatch({ type: "UPDATE_SEGMENT", id: seg._id, field: "end_m", value: ev.target.value })}
                />
                <div className="flex items-center">
                  {hasError && (
                    <span className="text-xs bg-red-950 text-red-400 px-1.5 py-0.5 rounded-full font-medium border border-red-800">
                      {Object.keys(e).length}!
                    </span>
                  )}
                </div>
              </div>

              {/* Inline field errors */}
              {(e.name || e.start_m || e.end_m || e.extra) && (
                <div className="flex flex-wrap gap-x-4 mt-0.5">
                  {e.name    && <FieldError msg={`name: ${e.name}`} />}
                  {e.start_m && <FieldError msg={`start: ${e.start_m}`} />}
                  {e.end_m   && <FieldError msg={`end: ${e.end_m}`} />}
                  {e.extra   && <FieldError msg={e.extra} />}
                </div>
              )}

              {/* Offset preview */}
              {offset !== 0 && trackLengthNum > 0 && seg.start_m !== "" && seg.end_m !== "" && (() => {
                const ds = offsetDisplay(seg.start_m, offset, trackLengthNum);
                const de = offsetDisplay(seg.end_m,   offset, trackLengthNum);
                if (ds === null || de === null) return null;
                return (
                  <div className="mt-1 text-xs text-amber-400">
                    <span className="text-zinc-500 mr-1">offset view:</span>
                    <span className="font-mono">{ds}m → {de}m</span>
                  </div>
                );
              })()}

              <TypeSpecificFields seg={seg} errors={e} dispatch={dispatch} />
            </div>

            {/* Card footer */}
            <div
              className="border-t px-3 py-1 flex gap-1 flex-wrap text-xs"
              style={{ borderColor: "#2a2a2a", backgroundColor: "#141414" }}
            >
              <button
                onClick={() => dispatch({ type: "MOVE_UP", id: seg._id })}
                disabled={index === 0}
                className="px-2 py-0.5 border border-zinc-700 rounded text-zinc-400 hover:border-red-600 hover:text-red-400 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
                title="Move up"
              >
                ↑ Up
              </button>
              <button
                onClick={() => dispatch({ type: "MOVE_DOWN", id: seg._id })}
                disabled={index === total - 1}
                className="px-2 py-0.5 border border-zinc-700 rounded text-zinc-400 hover:border-red-600 hover:text-red-400 disabled:opacity-30 disabled:cursor-not-allowed transition-colors"
                title="Move down"
              >
                ↓ Down
              </button>
              <span className="border-l border-zinc-700 mx-0.5" />
              <button
                onClick={() => dispatch({ type: "INSERT_ABOVE", id: seg._id })}
                className="px-2 py-0.5 border border-zinc-700 text-zinc-400 rounded hover:border-red-600 hover:text-red-400 transition-colors"
                title="Insert above"
              >
                + Above
              </button>
              <button
                onClick={() => dispatch({ type: "INSERT_BELOW", id: seg._id })}
                className="px-2 py-0.5 border border-zinc-700 text-zinc-400 rounded hover:border-red-600 hover:text-red-400 transition-colors"
                title="Insert below"
              >
                + Below
              </button>
              <span className="border-l border-zinc-700 mx-0.5" />
              <button
                onClick={() => dispatch({ type: "DELETE", id: seg._id })}
                className="px-2 py-0.5 border border-zinc-700 text-zinc-500 rounded hover:border-red-600 hover:text-red-500 transition-colors"
                title="Delete segment"
              >
                <i className="bi bi-trash" />
              </button>
            </div>
          </div>
        </div>
      );
    }

    function LoadModal({ dispatch }) {
      const [text, setText] = useState("");
      const [error, setError] = useState("");
      const fileRef = useRef(null);

      const tryLoad = (jsonStr, fileName = "") => {
        setError("");
        let data;
        try { data = JSON.parse(jsonStr); }
        catch (ex) { setError("Invalid JSON: " + ex.message); return; }
        const err = validateLoadedData(data);
        if (err) { setError(err); return; }
        dispatch({ type: "LOAD_JSON", data, fileName });
      };

      const handleFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => tryLoad(ev.target.result, file.name);
        reader.readAsText(file);
      };

      return (
        <div
          className="fixed inset-0 bg-black/75 flex items-center justify-center z-50"
          onClick={() => dispatch({ type: "CLOSE_LOAD_MODAL" })}
        >
          <div
            className="rounded-xl shadow-2xl p-6 w-full max-w-lg mx-4 border border-zinc-700"
            style={{ backgroundColor: "#1a1a1a" }}
            onClick={e => e.stopPropagation()}
          >
            <h2 className="text-lg font-semibold mb-4 text-white">Load JSON</h2>

            <div className="mb-4">
              <label className="block text-sm text-zinc-400 mb-1">Upload file</label>
              <input
                type="file"
                accept=".json,application/json"
                ref={fileRef}
                onChange={handleFile}
                className="text-sm text-zinc-400"
              />
            </div>

            <div className="mb-4">
              <label className="block text-sm text-zinc-400 mb-1">Or paste JSON</label>
              <textarea
                value={text}
                onChange={e => { setText(e.target.value); setError(""); }}
                rows={8}
                spellCheck={false}
                className="w-full border border-zinc-600 rounded px-3 py-2 text-sm font-mono bg-zinc-900 text-white placeholder-zinc-600 focus:outline-none focus:ring-1 focus:ring-red-500"
                placeholder={'{"circuit_name": "Monza", "circuit_number": 1, "segments": [...]}'}
              />
            </div>

            {error && (
              <div className="mb-3 text-sm text-red-400 bg-red-950 border border-red-800 rounded px-3 py-2">
                {error}
              </div>
            )}

            <div className="flex justify-end gap-2">
              <button
                onClick={() => dispatch({ type: "CLOSE_LOAD_MODAL" })}
                className="px-4 py-2 border border-zinc-600 rounded text-sm text-zinc-300 hover:border-zinc-400 transition-colors"
              >
                Cancel
              </button>
              <button
                onClick={() => tryLoad(text)}
                className="px-4 py-2 bg-red-600 text-white rounded text-sm hover:bg-red-700 transition-colors font-medium"
              >
                Load
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ─── GitHub Fetch Modal ─────────────────────────────────────────────────────
    // Thin UI over GitHubTrackSource. On success it hands the parsed JSON to the
    // existing LOAD_JSON flow — the editor never sees a GitHub-specific concept.

    function GitHubModal({ dispatch }) {
      const [branches, setBranches] = useState([]);
      const [branch, setBranch] = useState("");
      const [tracks, setTracks] = useState([]);
      const [trackPath, setTrackPath] = useState("");
      const [loadingBranches, setLoadingBranches] = useState(true);
      const [loadingTracks, setLoadingTracks] = useState(false);
      const [fetching, setFetching] = useState(false);
      const [error, setError] = useState("");

      const close = () => dispatch({ type: "CLOSE_GITHUB_MODAL" });

      // Load the branch list once. Default branch is selected and listed first.
      useEffect(() => {
        let cancelled = false;
        (async () => {
          setLoadingBranches(true);
          setError("");
          try {
